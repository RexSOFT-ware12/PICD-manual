services:
  - type: web
    name: picd-cloud-ide
    runtime: docker
    plan: standard
    rootDir: theia-master
    dockerfilePath: ./Dockerfile.picd
    dockerContext: .
    healthCheckPath: /healthz
    disk:
      name: picd-cloud-ide-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: THEIA_BASIC_AUTH_USER
        sync: false
      - key: THEIA_BASIC_AUTH_PASSWORD
        sync: false
